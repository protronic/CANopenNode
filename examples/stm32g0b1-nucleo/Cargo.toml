[package]
edition = "2021"
name = "canopen-stm32g0b1-nucleo"
version = "0.1.0"
license = "Apache-2.0"
publish = false

[dependencies]
embassy-stm32 = { git = "https://github.com/protronic/embassy", features = [
    "defmt",
    "time-driver-any",
    "stm32g0b1re",
    "memory-x",
    "unstable-pac",
    "exti",
] }
embassy-sync = { git = "https://github.com/protronic/embassy", features = ["defmt"] }
embassy-executor = { git = "https://github.com/protronic/embassy", features = [
    "platform-cortex-m",
    "executor-thread",
    "defmt",
] }
embassy-time = { git = "https://github.com/protronic/embassy", features = [
    "defmt",
    "defmt-timestamp-uptime",
    "tick-hz-32_768",
] }
embassy-futures = { git = "https://github.com/protronic/embassy" }

canopen-core = { path = "../../rust/canopen-core" }
canopen-embassy = { path = "../../rust/canopen-embassy" }
canopen-example-od = { path = "../../rust/canopen-example-od" }

defmt = "1.0.1"
defmt-rtt = "1.0.0"
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"
embedded-can = "0.4"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
heapless = { version = "0.9", default-features = false }

# canopen-embassy depends on embassy-time/embassy-futures from crates.io;
# unify them with the git versions so only one embassy-time is linked.
[patch.crates-io]
embassy-time = { git = "https://github.com/protronic/embassy" }
embassy-futures = { git = "https://github.com/protronic/embassy" }

[profile.release]
debug = 2

[[bin]]
name = "canopen"
path = "src/bin/canopen.rs"
